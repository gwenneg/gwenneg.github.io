version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # The build image: Hugo on the FROM line of .github/build/Dockerfile, Pagefind in .github/build/package.json
  - package-ecosystem: "docker"
    directory: "/.github/build"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/.github/build"
    schedule:
      interval: "weekly"
