name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Hugo and Pagefind run in the image built from .github/build, where Dependabot keeps their versions up to date.
      # The image's layers are cached between runs, so a run only rebuilds what changed.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the build image
        uses: docker/build-push-action@v7
        with:
          context: .github/build
          tags: blog-build
          load: true
          cache-from: type=gha,scope=blog-build
          cache-to: type=gha,scope=blog-build,mode=max
      - name: Build the site and its search index
        # The image runs as the runner's user, so it can write public/ in the checkout.
        run: |
          in_image() {
            docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --env HUGO_CACHEDIR=/tmp/hugo_cache \
              --env HUGO_BUILD_COMMIT="${GITHUB_SHA}" \
              --volume "${PWD}:/project" --workdir /project blog-build "$@"
          }
          in_image hugo --minify --panicOnWarning
          in_image pagefind --site public
      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Checks that gwenneg.com serves the version just deployed, and that its main pages, feed and search work.
  smoke-test:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check the live blog
        run: .github/smoke-test.sh https://gwenneg.com "${GITHUB_SHA}"
